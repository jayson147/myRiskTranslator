# Sample assets for risk-translator. All three are made up.
#
# criticality: how much harm the business would suffer if the system were
# breached or went offline (defined in src/risk_translator/scoring.py):
#   1 Negligible  test or lab system, no business data
#   2 Low         internal convenience tool, no sensitive data
#   3 Moderate    supports day-to-day work or holds internal data
#   4 High        important process, or personal or financial data
#   5 Critical    customer-facing or core to revenue, or payment data
#
# internet_facing: true if the system can be reached from the internet. It
# adds 1 to likelihood.
#
# description: a short noun phrase, e.g. "the customer booking website".
# It is used in the board summary ("It affects booking-web, the ...").

assets:
  - name: booking-web
    ip: 10.0.10.5
    owner: Head of Digital
    description: the customer booking website, which takes card payments
    criticality: 5
    internet_facing: true

  - name: finance-db
    ip: 10.0.20.12
    owner: Finance Director
    description: the accounts and payroll server
    criticality: 4
    internet_facing: false

  - name: staff-wiki
    ip: 10.0.30.8
    owner: IT Manager
    description: the internal staff wiki
    criticality: 2
    internet_facing: false

